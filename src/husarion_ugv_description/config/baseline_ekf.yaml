# --------------------------------------------------------------------------
#  NavSat Transform Node
# --------------------------------------------------------------------------
navsat_transform:
  ros__parameters:
    frequency: 10.0
    delay: 1.5
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    publish_filtered_gps: true
    use_odometry_yaw: true   # GPS frame was computed from drifting IMU yaw (no mag in sim) → EKF yaw is more stable
    wait_for_datum: false
    broadcast_cartesian_transform: true
    broadcast_cartesian_transform_as_parent_frame: false
